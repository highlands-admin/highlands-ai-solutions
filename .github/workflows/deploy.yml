name: Deploy to IONOS

# staging branch -> /staging on the webspace
# main branch    -> /prod    on the webspace
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# Never let two deploys to the same environment overlap. Queue instead of
# cancelling, so a half-finished mirror is never left on the server.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/prod" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Mirror site to ${{ steps.target.outputs.dir }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          # lftp reads the password from this variable via --env-password,
          # so it never appears in the process list or the build log.
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          TARGET_DIR: ${{ steps.target.outputs.dir }}
        run: |
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          set mirror:parallel-transfer-count 4
          mkdir -p -f $TARGET_DIR
          set cmd:fail-exit yes
          mirror --reverse --delete --verbose --exclude-glob .git* --exclude .github/ --exclude .claude/ --exclude .vercel/ --exclude-glob .env* --exclude-glob .DS_Store --exclude node_modules/ --exclude-glob package.json --exclude-glob preview-server.js --exclude-glob README.md ./ $TARGET_DIR
          bye
          LFTP_SCRIPT

      - name: Summary
        run: |
          echo "Deployed \`${{ github.ref_name }}\` (${GITHUB_SHA::7}) to \`${{ steps.target.outputs.dir }}\`" >> "$GITHUB_STEP_SUMMARY"
